<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture Slot</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #12161c;
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgb(0 0 0 / 0.55);
      }
      .overlay[hidden] {
        display: none;
      }
      .overlay button {
        font: 600 18px system-ui, sans-serif;
        padding: 12px 28px;
        border: 0;
        border-radius: 999px;
        background: #f2c94c;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <div class="overlay" id="overlay" hidden><button id="overlay-button">Continue</button></div>
    <script src="game.js"></script>
  </body>
</html>
